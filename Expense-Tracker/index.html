<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker 💸</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- Left Sidebar Navigation -->
  <aside class="sidebar">
    <div class="logo">
      <span class="logo-icon">💸</span>
      <h1>Spendly</h1>
    </div>
    
    <nav class="nav-menu">
      <button class="nav-btn active" onclick="showSection('dashboard')">
        <span>📊</span> Dashboard
      </button>
      <button class="nav-btn" onclick="showSection('add-expense')">
        <span>➕</span> Add Expense
      </button>
      <button class="nav-btn" onclick="showSection('categories')">
        <span>📂</span> Categories
      </button>
    </nav>
  </aside>

  <!-- Right Content Area -->
  <main class="main-content">

    <!-- Dashboard Section -->
    <section id="dashboard" class="content-section active">
      <h2 class="page-title">📊 Dashboard</h2>
      
      <!-- Summary Cards -->
      <div class="summary-cards">
        <div class="card summary-card">
          <div class="card-icon">🧾</div>
          <div class="card-info">
            <span class="card-label">Total Expenses</span>
            <span class="card-value" id="totalAmount">₹0</span>
          </div>
        </div>
        <div class="card summary-card">
          <div class="card-icon">📅</div>
          <div class="card-info">
            <span class="card-label" id="currentMonthLabel">This Month</span>
            <span class="card-value" id="monthlyAmount">₹0</span>
          </div>
        </div>
        <div class="card summary-card">
          <div class="card-icon">📈</div>
          <div class="card-info">
            <span class="card-label">Transactions</span>
            <span class="card-value" id="totalCount">0</span>
          </div>
        </div>
      </div>

      <!-- Charts Row -->
      <div class="charts-grid">
        <div class="card chart-card">
          <h3>📊 Category Distribution</h3>
          <canvas id="categoryChart"></canvas>
        </div>
        <div class="card chart-card">
          <h3>🥧 Daily Trend</h3>
          <canvas id="trendChart"></canvas>
        </div>
      </div>

      <!-- Recent Expenses -->
      <div class="card">
        <h3>🕒 Recent Expenses</h3>
        <div id="recentExpenses"></div>
      </div>
    </section>

    <!-- Add Expense Section -->
    <section id="add-expense" class="content-section">
      <h2 class="page-title">➕ Add Expense</h2>
      <div class="card form-card">
        <form id="expenseForm" onsubmit="saveExpense(event)">
          <input type="hidden" id="expenseId" />
          
          <div class="form-group">
            <label for="title">📝 Title</label>
            <input type="text" id="title" placeholder="e.g., Laptop service" required />
          </div>

          <div class="form-group">
            <label for="amount">💰 Amount (₹)</label>
            <input type="number" id="amount" placeholder="e.g., 3000" min="1" required />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="category">🏷️ Category</label>
              <select id="category" required>
                <option value="">Select...</option>
                <option value="Education">🎓 Education</option>
                <option value="Tech">💻 Tech</option>
                <option value="Travel">✈️ Travel</option>
                <option value="Food">🍔 Food</option>
                <option value="Internet">🌐 Internet</option>
                <option value="Health">🏥 Health</option>
                <option value="Shopping">🛍️ Shopping</option>
                <option value="Other">📦 Other</option>
              </select>
            </div>

            <div class="form-group">
              <label for="date">📅 Date</label>
              <input type="date" id="date" required />
            </div>
          </div>

          <div class="form-group">
            <label for="notes">🗒️ Notes <span class="optional">(optional)</span></label>
            <textarea id="notes" rows="2" placeholder="Any extra details..."></textarea>
          </div>

          <div class="form-actions">
            <button type="button" class="btn-secondary" onclick="resetForm()">Clear</button>
            <button type="submit" class="btn-primary" id="saveBtn">Save Expense</button>
          </div>
        </form>
      </div>
    </section>

    <!-- Categories Section -->
    <section id="categories" class="content-section">
      <h2 class="page-title">📂 Categories</h2>
      
      <div class="card">
        <div class="list-header">
          <h3>All Expenses by Category</h3>
          <select id="filterMonth" class="filter-select" onchange="renderExpenses()">
            <option value="all">All Time</option>
          </select>
        </div>
        
        <div id="categoryBreakdown" class="category-list"></div>
      </div>

      <div class="card" style="margin-top: 20px;">
        <h3>🗂️ All Expenses</h3>
        <div id="expenseList" class="expense-list"></div>
      </div>
    </section>

  </main>

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
