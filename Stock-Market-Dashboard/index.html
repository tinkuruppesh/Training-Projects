<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Market Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <!-- Chart.js for line charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>
<body>
  <!-- Header Section -->
  <header class="header">
    <div class="container">
      <h1 class="logo">📈 Stock Market Dashboard</h1>
      <div class="header-info">
        <span class="last-update">Last Updated: <span id="lastUpdate">--</span></span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <!-- Search Bar -->
    <div class="search-section">
      <input 
        type="text" 
        id="searchInput" 
        class="search-input" 
        placeholder="Search stocks (e.g., AAPL, GOOGL, MSFT)..."
      >
      <button id="searchBtn" class="search-btn">Search</button>
    </div>

    <!-- Watchlist Section -->
    <section class="watchlist-section">
      <div class="section-header">
        <h2>⭐ My Watchlist</h2>
        <span class="watchlist-count" id="watchlistCount">0 stocks</span>
      </div>
      <div id="watchlistGrid" class="stock-grid">
        <div class="empty-state">Add stocks to your watchlist</div>
      </div>
    </section>

    <!-- Popular Stocks Section -->
    <section class="stocks-section">
      <div class="section-header">
        <h2>🔥 Popular Stocks</h2>
      </div>
      <div id="stocksGrid" class="stock-grid">
        <!-- Loading skeleton -->
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </section>

    <!-- Chart Section -->
    <section class="chart-section">
      <div class="section-header">
        <h2 id="chartTitle">Select a stock to view chart</h2>
        <div class="time-filters">
          <button class="time-btn active" data-period="1D">1D</button>
          <button class="time-btn" data-period="1W">1W</button>
          <button class="time-btn" data-period="1M">1M</button>
        </div>
      </div>
      <div class="chart-container">
        <canvas id="stockChart"></canvas>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>Stock Market Dashboard | Data provided by Twelve Data API</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
