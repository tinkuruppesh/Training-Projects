<!DOCTYPE html>
<html>
<head>
    <title>Chat Test</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #667eea; }
        #messages { background: white; padding: 20px; margin-bottom: 20px; min-height: 300px; border-radius: 10px; }
        .message { margin: 10px 0; padding: 10px; border-radius: 8px; }
        .user { background: #667eea; color: white; text-align: right; }
        .bot { background: #f0f0f0; }
        #input { width: 70%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
        button { padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1 style="color: white;">Chat Test</h1>
    <div id="messages"></div>
    <input type="text" id="input" placeholder="Type message...">
    <button onclick="send()">Send</button>
    
    <script>
        function send() {
            const input = document.getElementById('input');
            const text = input.value.trim();
            if (!text) return;
            
            const messages = document.getElementById('messages');
            messages.innerHTML += `<div class="message user">You: ${text}</div>`;
            input.value = '';
            
            setTimeout(() => {
                messages.innerHTML += `<div class="message bot">Bot: I received your message: "${text}"</div>`;
            }, 1000);
        }
        
        document.getElementById('input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') send();
        });
    </script>
</body>
</html>
