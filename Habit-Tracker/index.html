<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 Habit Tracker</h1>
      <p class="subtitle">Build better habits, one day at a time</p>
    </header>

    <main>
      <!-- Add Habit Section -->
      <section class="add-habit-section">
        <div class="input-group">
          <input type="text" id="habitInput" placeholder="Enter a new habit (e.g., Exercise, Read, Meditate)">
          <button id="addHabitBtn">Add Habit</button>
        </div>
      </section>

      <!-- Habits List -->
      <section class="habits-section">
        <h2>Today's Habits</h2>
        <div id="todayDate" class="today-date"></div>
        <div id="habitsList" class="habits-list"></div>
      </section>

      <!-- Heatmap Section -->
      <section class="heatmap-section">
        <h2>Activity Heatmap</h2>
        <div class="heatmap-controls">
          <select id="habitSelect">
            <option value="">Select a habit to view</option>
          </select>
        </div>
        <div id="heatmapContainer" class="heatmap-container"></div>
      </section>

      <!-- Insights Section -->
      <section class="insights-section">
        <h2>Insights</h2>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value" id="totalDays">0</div>
            <div class="stat-label">Total Days</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="currentStreak">0</div>
            <div class="stat-label">Current Streak</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="longestStreak">0</div>
            <div class="stat-label">Longest Streak</div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <h3>Edit Habit</h3>
      <input type="text" id="editHabitInput" placeholder="Habit name">
      <div class="modal-actions">
        <button id="saveEditBtn" class="btn-primary">Save</button>
        <button id="cancelEditBtn" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
