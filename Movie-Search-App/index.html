<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVault - Movie Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">
        <div class="container">
            <div class="logo">
                <span class="logo-icon">🎬</span>
                <h1>CineVault</h1>
            </div>
            <div class="nav-actions">
                <button class="nav-btn" onclick="showWatchlist()">
                    <span>📌</span>
                    <span>Watchlist</span>
                    <span class="badge" id="watchlistBadge">0</span>
                </button>
                <button class="nav-btn" onclick="toggleTheme()">🌓</button>
            </div>
        </div>
    </div>

    <div class="hero">
        <div class="container">
            <h2 class="hero-title">Discover Your Next Favorite Movie</h2>
            <p class="hero-subtitle">Search from millions of movies and TV shows</p>
            
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search movies, TV shows..." onkeypress="handleSearch(event)">
                <button class="search-btn" onclick="searchMovies()">
                    <span>🔍</span>
                    <span>Search</span>
                </button>
            </div>

            <div class="filters">
                <select id="typeFilter" onchange="applyFilters()">
                    <option value="">All Types</option>
                    <option value="movie">Movies</option>
                    <option value="series">TV Series</option>
                    <option value="episode">Episodes</option>
                </select>
                <select id="yearFilter" onchange="applyFilters()">
                    <option value="">All Years</option>
                </select>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="stats" id="stats"></div>
        
        <div class="movies-grid" id="moviesGrid"></div>
        
        <div class="pagination" id="pagination"></div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading movies...</p>
        </div>
        
        <div class="empty-state" id="emptyState">
            <span class="empty-icon">🎬</span>
            <h3>No Movies Found</h3>
            <p>Try searching for something else</p>
        </div>
    </div>

    <div class="modal" id="movieModal">
        <div class="modal-overlay" onclick="closeModal()"></div>
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">×</button>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <div class="side-panel" id="watchlistPanel">
        <button class="panel-close" onclick="closeWatchlist()">×</button>
        <div class="panel-header">
            <h3>My Watchlist</h3>
        </div>
        <div class="watchlist-content" id="watchlistContent"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
