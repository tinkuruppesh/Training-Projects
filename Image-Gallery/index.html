<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelVault - Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <span class="logo-icon">🖼️</span>
                <h1>PixelVault</h1>
            </div>
            
            <div class="header-actions">
                <button class="btn-upload" onclick="document.getElementById('fileInput').click()">
                    📤 Upload Image
                </button>
                <input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="handleFileUpload(event)">
            </div>
        </div>
    </header>

    <!-- Search & Filters -->
    <section class="controls">
        <div class="container">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="🔍 Search images by title or tags..." oninput="filterGallery()">
            </div>

            <div class="filter-section">
                <div class="category-filters" id="categoryFilters">
                    <button class="filter-btn active" data-category="all" onclick="filterByCategory('all')">All</button>
                    <button class="filter-btn" data-category="nature" onclick="filterByCategory('nature')">🌿 Nature</button>
                    <button class="filter-btn" data-category="architecture" onclick="filterByCategory('architecture')">🏛️ Architecture</button>
                    <button class="filter-btn" data-category="people" onclick="filterByCategory('people')">👥 People</button>
                    <button class="filter-btn" data-category="animals" onclick="filterByCategory('animals')">🐾 Animals</button>
                    <button class="filter-btn" data-category="food" onclick="filterByCategory('food')">🍔 Food</button>
                    <button class="filter-btn" data-category="technology" onclick="filterByCategory('technology')">💻 Technology</button>
                </div>

                <div class="view-controls">
                    <button class="view-btn active" onclick="setView('grid')" title="Grid View">
                        <span>⊞</span>
                    </button>
                    <button class="view-btn" onclick="setView('list')" title="List View">
                        <span>☰</span>
                    </button>
                    <select id="sortSelect" onchange="sortGallery()">
                        <option value="newest">Newest First</option>
                        <option value="oldest">Oldest First</option>
                        <option value="name">Name A-Z</option>
                        <option value="favorites">Favorites</option>
                    </select>
                </div>
            </div>
        </div>
    </section>

    <!-- Gallery Stats -->
    <section class="stats">
        <div class="container">
            <div class="stat-item">
                <span class="stat-value" id="totalImages">0</span>
                <span class="stat-label">Total Images</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="filteredImages">0</span>
                <span class="stat-label">Showing</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="favoriteCount">0</span>
                <span class="stat-label">Favorites</span>
            </div>
        </div>
    </section>

    <!-- Gallery Grid -->
    <section class="gallery-section">
        <div class="container">
            <div class="gallery-grid" id="galleryGrid"></div>
            
            <div class="empty-state" id="emptyState">
                <span class="empty-icon">🖼️</span>
                <h2>No Images Found</h2>
                <p>Upload your first image to get started!</p>
                <button class="btn-primary" onclick="document.getElementById('fileInput').click()">Upload Image</button>
            </div>
        </div>
    </section>

    <!-- Lightbox Modal -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <button class="lightbox-nav prev" onclick="navigateImage(-1)">‹</button>
        <button class="lightbox-nav next" onclick="navigateImage(1)">›</button>
        
        <div class="lightbox-content">
            <img id="lightboxImage" src="" alt="">
            
            <div class="lightbox-info">
                <div class="lightbox-header">
                    <h2 id="lightboxTitle"></h2>
                    <div class="lightbox-actions">
                        <button class="icon-btn" onclick="toggleFavorite()" title="Favorite">
                            <span id="lightboxFavorite">☆</span>
                        </button>
                        <button class="icon-btn" onclick="downloadImage()" title="Download">📥</button>
                        <button class="icon-btn" onclick="deleteImage()" title="Delete">🗑️</button>
                    </div>
                </div>
                
                <div class="lightbox-meta">
                    <span id="lightboxCategory"></span>
                    <span id="lightboxDate"></span>
                </div>
                
                <div class="lightbox-tags" id="lightboxTags"></div>
            </div>
        </div>
    </div>

    <!-- Category Selection Modal -->
    <div class="category-modal" id="categoryModal">
        <div class="modal-content">
            <h2>Select Category</h2>
            <p>Choose a category for your uploaded image(s)</p>
            
            <div class="category-grid">
                <button class="category-option" onclick="selectUploadCategory('nature')">
                    <span>🌿</span>
                    <span>Nature</span>
                </button>
                <button class="category-option" onclick="selectUploadCategory('architecture')">
                    <span>🏛️</span>
                    <span>Architecture</span>
                </button>
                <button class="category-option" onclick="selectUploadCategory('people')">
                    <span>👥</span>
                    <span>People</span>
                </button>
                <button class="category-option" onclick="selectUploadCategory('animals')">
                    <span>🐾</span>
                    <span>Animals</span>
                </button>
                <button class="category-option" onclick="selectUploadCategory('food')">
                    <span>🍔</span>
                    <span>Food</span>
                </button>
                <button class="category-option" onclick="selectUploadCategory('technology')">
                    <span>💻</span>
                    <span>Technology</span>
                </button>
            </div>
            
            <button class="btn-cancel" onclick="cancelUpload()">Cancel</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
