<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="weather-style.css">
</head>
<body>
    <div class="container">
        <div class="weather-card">
            <h1>🌤️ Weather App</h1>
            
            <!-- Search Section -->
            <div class="search-box">
                <input type="text" id="cityInput" placeholder="Enter city name..." />
                <button id="searchBtn">Search</button>
            </div>

            <!-- Forecast Tabs -->
            <div class="forecast-tabs" id="forecastTabs" style="display:none;">
                <button class="tab-btn active" onclick="selectDay(0)">Today</button>
                <button class="tab-btn" onclick="selectDay(1)">Tomorrow</button>
                <input type="date" id="dateInput" class="date-picker" onchange="selectCustomDate()" />
            </div>

            <!-- Loading Spinner -->
            <div class="loader" id="loader"></div>

            <!-- Error Message -->
            <div class="error" id="error"></div>

            <!-- Weather Display -->
            <div class="weather-info" id="weatherInfo">
                <div class="city-name" id="cityName"></div>
                
                <div class="temperature-box">
                    <div class="temperature" id="temperature"></div>
                    <div class="weather-icon" id="weatherIcon"></div>
                </div>

                <div class="condition" id="condition"></div>

                <div class="details-grid">
                    <div class="detail-item">
                        <div class="detail-icon">💧</div>
                        <div class="detail-label">Humidity</div>
                        <div class="detail-value" id="humidity"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-icon">💨</div>
                        <div class="detail-label">Wind Speed</div>
                        <div class="detail-value" id="windSpeed"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-icon">🌡️</div>
                        <div class="detail-label">Feels Like</div>
                        <div class="detail-value" id="feelsLike"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-icon">👁️</div>
                        <div class="detail-label">Visibility</div>
                        <div class="detail-value" id="visibility"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="weather-script.js"></script>
</body>
</html>
